name: CI - Quality

# 코드 빌드/테스트/정적 분석 워크플로
# Convention 검증(커밋·PR 타이틀 형식)은 ci-convention.yml 에 분리되어 있습니다.
# job `name:` 값은 GitHub Required Status Check 컨텍스트로 사용되므로 변경 금지
# (docs/ci/status-checks.md 단일 소스 참조).

on:
  pull_request:
    branches: ["**"]

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            {
              echo "## ❌ Format Check 실패"
              echo "다음 파일이 gofmt 포맷을 따르지 않습니다:"
              echo ""
              echo '```'
              echo "$unformatted"
              echo '```'
              echo ""
              echo "\`gofmt -w .\` 를 실행하여 수정하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## ✅ Format Check 통과" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go build ./... 2>&1 | tee build.log
          echo "## ✅ Build 성공" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ubuntu-latest

    # Redis service — 통합 테스트가 항상 skip 되던 문제 해소 (이슈 #562).
    #
    # pkg/redis 의 토큰 락은 Lua compare-and-delete 로 소유권을 검증하는데,
    # internal/locks 의 회귀 테스트는 fake Redis 를 써서 스크립트 자체를 검증하지 못한다.
    # 실제 Redis 가 없으면 관련 테스트가 t.Skip 으로 조용히 빠져나가므로, Lua 가 깨져도
    # CI 가 통과한다. 기본 포트/호스트를 쓰므로 별도 env 주입은 필요 없다
    # (pkg/config/storage.LoadRedis 의 기본값 localhost:6379).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Postgres service — internal/storage/postgres 가 전부 미검증이던 문제 해소 (이슈 #612).
      #
      # 이슈 #382 가 host 별 signal 집계 SQL (CTE + DISTINCT ON + FILTER + regexp host 파생) 을
      # 추가했으나 실행해 본 적이 없다. 실제로 그 SQL 에서 대소문자 버그를 하나 찾았는데
      # 코드를 읽어서 찾은 것이고, 돌려봤다면 즉시 드러났을 종류다.
      #
      # redis 와 같은 이유다 (이슈 #562): DB 가 없으면 통합 테스트가 t.Skip 으로 빠져나가
      # SQL 이 깨져도 CI 가 통과한다.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: issuetracker
          POSTGRES_PASSWORD: issuetracker
          POSTGRES_DB: issuetracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 스키마 적용 — 통합 테스트가 실제 테이블을 필요로 한다 (이슈 #612).
      # cmd/migrate 를 쓰는 이유: 테스트가 자체 DDL 을 들고 있으면 migrations/ 와 갈라져,
      # 마이그레이션이 깨져도 테스트는 통과하는 상태가 된다.
      - name: Apply migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: issuetracker
          POSTGRES_PASSWORD: issuetracker
          POSTGRES_DB: issuetracker_test
          POSTGRES_SSLMODE: disable
        run: go run ./cmd/migrate

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: issuetracker
          POSTGRES_PASSWORD: issuetracker
          POSTGRES_DB: issuetracker_test
          POSTGRES_SSLMODE: disable
          # 통합 테스트가 CI 에서 조용히 skip 되지 않도록 강제한다 (이슈 #612).
          #
          # 가용성 기반 skip 은 로컬 편의를 위한 것이다. CI 에서까지 허용하면 서비스 연결
          # 설정이 어긋났을 때 전부 skip 되고 CI 는 초록색이 된다 — 게이트가 꺼진 것과
          # 구별되지 않는다.
          REQUIRE_INTEGRATION_DEPS: "true"
        run: go test -race -coverprofile=coverage.out -coverpkg=./internal/...,./pkg/... -count=1 ./...

      # ── 1. 가시성: 커버리지 결과를 PR Summary에 직접 표시 ────────
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f coverage.out ]; then
            echo "## ⚠️ 커버리지 파일 없음 (테스트 실패)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          threshold=40

          {
            echo "## 📊 테스트 커버리지: ${total}%"
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| 전체 커버리지 | **${total}%** |"
            echo "| 임계값 | ${threshold}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          # ── 3. CI 강제: 임계값 미달 시 에러 ───────────────────────
          if [ "$(echo "$total < $threshold" | bc -l)" -eq 1 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ 커버리지 ${total}%가 임계값 ${threshold}% 미만입니다." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
