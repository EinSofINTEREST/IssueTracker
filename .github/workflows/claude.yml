name: Claude

# @claude 멘션으로 호출되는 대화형 에이전트 (이슈 #549).
#
# 역할 분담 — CLAUDE.md "PR 생성 후 피드백 대응" 참조:
#   - 작업 세션이 살아있을 때  → 그 세션에서 직접 처리 (작업 맥락 보존)
#   - 세션을 닫은 뒤 / 타인 리뷰 → 본 워크플로 (@claude 멘션)
#
# 저장소 규약 (커밋 prefix, PR 타이틀, 테스트 위치 등) 은 CLAUDE.md 를 통해 전달됩니다 —
# 액션이 저장소 컨텍스트를 읽으므로 별도 주입 불필요.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# 동일 이슈/PR 에 연속 멘션 시 이전 실행을 취소 — 중복 커밋 방지 + 비용 절감.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # @claude 가 포함된 이벤트만 job 자체를 기동 — 무관한 코멘트로 runner 를 소모하지 않음.
    # 액션 내부에도 동일 검사가 있으나, 여기서 거르면 Actions 사용량이 줄어듭니다.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 최소 권한 — 피드백 대응은 커밋 푸시 + 코멘트 작성이 필요하므로 contents/pull-requests/issues write.
    # actions: read 는 실패한 CI 로그를 읽기 위함 (CLAUDE.md 의 "CI 실패 우선 처리" 절차).
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 규약상 커밋 이력 확인이 필요한 경우 대비

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # 인증 — 본 저장소는 claudegen 이 구독 인증(CLAUDE_CODE_AUTH_DIR)을 쓰므로 일관성을 위해
          # OAuth 토큰을 기본으로 둡니다. 종량 API 키를 쓰려면 아래를 anthropic_api_key 로 교체:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # ── 보안: 본 저장소는 PUBLIC ────────────────────────────────────────
          # 액션은 기본적으로 **write 권한 보유자만** 트리거할 수 있게 검사하며, GitHub App / bot 은
          # 기본 차단됩니다. 아래 두 설정은 그 방어를 푸는 것이라 의도적으로 비워 둡니다.
          #
          #   allowed_bots            — CodeRabbit 등 봇이 직접 @claude 를 부르게 허용.
          #                             봇 코멘트 본문이 그대로 프롬프트가 되어 prompt injection
          #                             표면이 넓어집니다. CodeRabbit 피드백은 사람이 @claude 로
          #                             지시하는 방식을 유지합니다.
          #   allowed_non_write_users — write 권한 검사 우회. 공개 저장소에서는 사용 금지.
          #
          # 외부 기여자가 숨긴 지시(HTML 주석 등)가 섞일 수 있으므로, 신뢰할 수 없는 내용을 인용해
          # @claude 를 부를 때는 사람이 내용을 확인한 뒤 호출합니다.
